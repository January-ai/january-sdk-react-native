appId: ai.january.sdk.demo
# URL-encoded Metro address for the dev-client deep link. Override to point the
# dev client at another Metro, e.g. a fixture-mode one on another port while a
# live one keeps serving a device: -e METRO_URL=http%3A%2F%2F127.0.0.1%3A8082
env:
  METRO_URL: http%3A%2F%2F127.0.0.1%3A8081
---
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - launchApp:
                clearState: false
                stopApp: true
            # The dev client reconnects to its last server, so point it explicitly.
            - openLink: exp+january-sdk-demo://expo-development-client/?url=${METRO_URL}
            - waitForAnimationToEnd
      - runFlow:
          when:
            platform: Android
          commands:
            - launchApp:
                clearState: false
                stopApp: true
            # expo-dev-launcher 57 shows "Development servers" (no "New development
            # server" card any more); match either wording, any case.
            - extendedWaitUntil:
                visible: "(?i).*development server.*"
                timeout: 30000
            - openLink: exp+january-sdk-demo://expo-development-client/?url=${METRO_URL}
            - waitForAnimationToEnd
            - openLink: exp+january-sdk-demo://expo-development-client/?url=${METRO_URL}
            - waitForAnimationToEnd
            # react-native-screens can throw "runtime not ready" on a warm
            # relaunch of the dev build; RELOAD on the red screen recovers it.
            - tapOn:
                text: "RELOAD.*"
                optional: true
            - waitForAnimationToEnd
            - tapOn:
                text: "RELOAD.*"
                optional: true
      - tapOn:
          text: Continue
          optional: true
      - tapOn:
          text: Close
          optional: true
      - extendedWaitUntil:
          visible:
            id: search-screen
          timeout: 45000
