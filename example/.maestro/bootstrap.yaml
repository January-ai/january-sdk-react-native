appId: ai.january.sdk.demo
# Metro address the dev client should load from: 8081 unless the run passes
# both of these, e.g. for a fixture-mode Metro on another port while a live one
# keeps serving a device:
#   -e METRO_URL=http://127.0.0.1:8082 -e METRO_URL_ENCODED=http%3A%2F%2F127.0.0.1%3A8082
# The defaults live in the expressions below rather than an `env:` block,
# because a subflow's own env replaces the value passed on the command line.
---
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            # A cold start with --initialUrl loads straight from Metro. Do not use
            # the dev-client deep link here: reloading an already running app
            # crashes expo-modules-core 55 on iOS (JSI object freed after the
            # runtime is torn down).
            - launchApp:
                clearState: false
                stopApp: true
                arguments:
                  --initialUrl: "${typeof METRO_URL === 'undefined' ? 'http://127.0.0.1:8081' : METRO_URL}"
                  # Read by expo-dev-menu through UserDefaults (the argument
                  # domain), so the "This is the developer menu" onboarding
                  # sheet never covers the app on a fresh simulator.
                  -EXDevMenuIsOnboardingFinished: "1"
                  -EXDevMenuShowFloatingActionButton: "0"
      - runFlow:
          when:
            platform: Android
          commands:
            # Kill the previous flow's app before anything else talks to the
            # device. Twice on the hosted emulator the app was left frozen
            # (frames taking twenty seconds) and Maestro's next launch stalled
            # for nineteen minutes on it.
            - stopApp
            - launchApp:
                clearState: false
                stopApp: true
            # A freshly booted hosted emulator sometimes shows a "<launcher>
            # isn't responding" dialog over the app. Dismiss it so the
            # dev-launcher screen below is reachable.
            - tapOn:
                text: "Close app"
                optional: true
            # The dev launcher shows "Development servers"; match any wording
            # that contains it, any case.
            - extendedWaitUntil:
                visible: "(?i).*development server.*"
                timeout: 30000
            - openLink: "exp+january-sdk-demo://expo-development-client/?url=${typeof METRO_URL_ENCODED === 'undefined' ? 'http%3A%2F%2F127.0.0.1%3A8081' : METRO_URL_ENCODED}"
            - waitForAnimationToEnd
            - openLink: "exp+january-sdk-demo://expo-development-client/?url=${typeof METRO_URL_ENCODED === 'undefined' ? 'http%3A%2F%2F127.0.0.1%3A8081' : METRO_URL_ENCODED}"
            - waitForAnimationToEnd
            # react-native-screens can throw "runtime not ready" on a warm
            # relaunch of the dev build; RELOAD on the red screen recovers it.
            - tapOn:
                text: "RELOAD.*"
                optional: true
            - waitForAnimationToEnd
            - tapOn:
                text: "RELOAD.*"
                optional: true
      - tapOn:
          text: Continue
          optional: true
      - tapOn:
          text: Close
          optional: true
      # The first launch on a hosted runner waits for Metro's first bundle,
      # which has taken close to two minutes there.
      - extendedWaitUntil:
          visible:
            id: search-screen
          timeout: 120000
