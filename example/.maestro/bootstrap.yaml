appId: ai.january.sdk.demo
# Metro address the dev client should load from. Override both to point at
# another Metro, e.g. a fixture-mode one on another port while a live one keeps
# serving a device:
#   -e METRO_URL=http://127.0.0.1:8082 -e METRO_URL_ENCODED=http%3A%2F%2F127.0.0.1%3A8082
env:
  METRO_URL: http://127.0.0.1:8081
  METRO_URL_ENCODED: http%3A%2F%2F127.0.0.1%3A8081
---
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            # A cold start with --initialUrl loads straight from Metro. Do not use
            # the dev-client deep link here: reloading an already running app
            # crashes expo-modules-core 55 on iOS (JSI object freed after the
            # runtime is torn down).
            - launchApp:
                clearState: false
                stopApp: true
                arguments:
                  --initialUrl: ${METRO_URL}
      - runFlow:
          when:
            platform: Android
          commands:
            - launchApp:
                clearState: false
                stopApp: true
            # expo-dev-launcher 57 shows "Development servers" (no "New development
            # server" card any more); match either wording, any case.
            - extendedWaitUntil:
                visible: "(?i).*development server.*"
                timeout: 30000
            - openLink: exp+january-sdk-demo://expo-development-client/?url=${METRO_URL_ENCODED}
            - waitForAnimationToEnd
            - openLink: exp+january-sdk-demo://expo-development-client/?url=${METRO_URL_ENCODED}
            - waitForAnimationToEnd
            # react-native-screens can throw "runtime not ready" on a warm
            # relaunch of the dev build; RELOAD on the red screen recovers it.
            - tapOn:
                text: "RELOAD.*"
                optional: true
            - waitForAnimationToEnd
            - tapOn:
                text: "RELOAD.*"
                optional: true
      - tapOn:
          text: Continue
          optional: true
      - tapOn:
          text: Close
          optional: true
      - extendedWaitUntil:
          visible:
            id: search-screen
          timeout: 45000
