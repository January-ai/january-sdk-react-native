appId: ai.january.sdk.demo
name: Live - glucose prediction for a meal
tags:
  - live
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-glucose
    timeout: 15000
# Records the end user and stops here, before any request of the flow's own,
# if the API account has no requests left.
- runFlow: ../live/context.yaml
- tapOn:
    id: tab-glucose
- scrollUntilVisible:
    element:
      id: glucose-add-food
    direction: DOWN
- tapOn:
    id: glucose-add-food
- tapOn:
    id: food-picker-input
- inputText: banana
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-picker-result-0
    timeout: 30000
- tapOn:
    id: food-picker-result-0
- tapOn:
    id: food-serving-add
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: glucose-predict
- waitForAnimationToEnd
- tapOn:
    id: glucose-predict
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: glucose-results-screen|glucose-error
    timeout: 60000
- takeScreenshot: example/.maestro/artifacts/live-glucose
- assertNotVisible:
    id: glucose-error
- assertVisible:
    id: glucose-chart
- assertVisible: LIKELY PEAK
