appId: ai.january.sdk.demo
name: Tracking - weight in kilograms and previous day
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-tracking
    timeout: 15000
- tapOn:
    id: tab-tracking
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-empty
- assertVisible: No weight logged on this day
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-unit-kg
- tapOn:
    id: weight-unit-kg
- tapOn:
    id: weight-value
- inputText: "70"
- pressKey: Enter
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-log
- tapOn:
    id: weight-log
- extendedWaitUntil:
    visible:
      id: weight-logged
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: weight-day
    timeout: 15000
- assertVisible: .*70 kg.*
- takeScreenshot: example/.maestro/artifacts/react-native-weight-logged
- scrollUntilVisible:
    element:
      id: logs-day-previous
    direction: UP
- tapOn:
    id: logs-day-previous
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-empty
- scrollUntilVisible:
    element:
      id: logs-day-today
    direction: UP
- tapOn:
    id: logs-day-today
# Today's meals load after the weight card renders and push it down; scroll to
# it only once they are on screen. They sit at the top, above the charts the
# screen is scrolled to.
- scrollUntilVisible:
    element:
      id: tracking-totals
    direction: UP
    timeout: 15000
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-day
- assertVisible: .*70 kg.*
