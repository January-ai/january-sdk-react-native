appId: ai.january.sdk.demo
name: Every primary destination is reachable
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-scan
    timeout: 15000
- tapOn:
    id: tab-scan
- assertVisible:
    id: scan-screen
- assertVisible: Scan a meal
- tapOn:
    id: tab-tracking
- assertVisible:
    id: tracking-screen
- assertVisible: Tracking
- assertVisible:
    id: logs-day-picker
- tapOn:
    id: tab-food-logs
- assertVisible:
    id: food-logs-screen
# "Logs" alone also matches the tab label; this heading is only on the screen.
- assertVisible: Build one complete meal
- tapOn:
    id: tab-glucose
- assertVisible:
    id: glucose-screen
- assertVisible: Estimate this meal’s response
- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
