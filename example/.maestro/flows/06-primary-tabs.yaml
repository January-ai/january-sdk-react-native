appId: ai.january.sdk.demo
name: Every primary destination is reachable
tags:
  - fixture
---
- launchApp:
    clearState: false
    stopApp: true
- openLink: exp+january-sdk-demo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- runFlow:
    when:
      visible: http://127.0.0.1:8081
    commands:
      - tapOn: http://127.0.0.1:8081
- extendedWaitUntil:
    visible:
      id: tab-scan
    timeout: 15000
- tapOn:
    id: tab-scan
- assertVisible:
    id: scan-screen
- assertVisible: Scan a meal
- tapOn:
    id: tab-food-logs
- assertVisible:
    id: food-logs-screen
- assertVisible: Food logs
- tapOn:
    id: tab-glucose
- assertVisible:
    id: glucose-screen
- assertVisible: Estimate this meal’s response
- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
