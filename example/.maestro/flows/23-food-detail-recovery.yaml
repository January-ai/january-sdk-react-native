appId: ai.january.sdk.demo
name: Food detail glucose and alternatives recover without losing context
tags:
  - fixture
  - recovery
---
- launchApp:
    clearState: false
    stopApp: true
- openLink: exp+january-sdk-demo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- runFlow:
    when:
      visible: http://127.0.0.1:8081
    commands:
      - tapOn: http://127.0.0.1:8081
- extendedWaitUntil:
    visible:
      id: tab-search
    timeout: 15000
- tapOn:
    id: tab-search
- tapOn:
    id: search-input
- inputText: glucose recovery
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-result-0
    timeout: 15000
- tapOn:
    id: food-result-0
- scrollUntilVisible:
    element:
      id: food-check-glucose
    direction: DOWN
- tapOn:
    id: food-check-glucose
- assertVisible:
    id: food-glucose-loading
- extendedWaitUntil:
    visible:
      id: food-glucose-error
    timeout: 15000
- takeScreenshot: example/.maestro/artifacts/react-native-food-glucose-error
- tapOn:
    id: food-glucose-error-retry
- extendedWaitUntil:
    visible:
      id: food-glucose-result
    timeout: 15000
- tapOn: Close Glucose response
- tapOn:
    id: food-detail-back
- tapOn:
    id: search-clear
- tapOn:
    id: search-input
- inputText: alternatives error
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-result-0
    timeout: 15000
- tapOn:
    id: food-result-0
- scrollUntilVisible:
    element:
      id: food-alternatives
    direction: DOWN
- tapOn:
    id: food-alternatives
- scrollUntilVisible:
    element:
      id: alternatives-refresh
    direction: DOWN
- tapOn:
    id: alternatives-refresh
- assertVisible:
    id: alternatives-loading
- extendedWaitUntil:
    visible:
      id: alternatives-error
    timeout: 15000
- takeScreenshot: example/.maestro/artifacts/react-native-alternatives-error
- scrollUntilVisible:
    element:
      id: alternatives-error-retry
    direction: DOWN
- tapOn:
    id: alternatives-error-retry
- extendedWaitUntil:
    visible:
      id: alternatives-results
    timeout: 15000
