appId: ai.january.sdk.demo
name: Restaurants - menu loading, error and retry, empty, and a menu item's glucose impact
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: search-scope-restaurants
    timeout: 15000
- tapOn:
    id: search-scope-restaurants
# "menu loading" makes the restaurant's menu slow to arrive.
- tapOn:
    id: restaurant-search-input
- inputText: menu loading
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 15000
- tapOn:
    id: restaurant-result-0
- extendedWaitUntil:
    visible:
      id: menu-loading
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: restaurant-menu-item-0
    timeout: 10000
- tapOn:
    id: restaurant-menu-item-0
- assertVisible:
    id: menu-item-detail-screen
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: menu-item-serving
- assertVisible: 1 bowl · 100 g
# The menu item's glucose impact, predicted for its serving.
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: menu-glucose-button
- tapOn:
    id: menu-glucose-button
- extendedWaitUntil:
    visible:
      id: food-glucose-loading
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: food-glucose-result
    timeout: 15000
- assertVisible: Fixture bowl
- takeScreenshot: example/.maestro/artifacts/react-native-menu-glucose
- tapOn: Close Glucose response
- tapOn:
    id: menu-item-detail-back
- extendedWaitUntil:
    visible:
      id: restaurant-detail-screen
    timeout: 10000
- tapOn:
    id: restaurant-detail-back
# "menu error" makes the menu fail once; Try again loads it.
- extendedWaitUntil:
    visible:
      id: restaurant-search-clear
    timeout: 10000
- tapOn:
    id: restaurant-search-clear
- tapOn:
    id: restaurant-search-input
- inputText: menu error
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 15000
- tapOn:
    id: restaurant-result-0
- extendedWaitUntil:
    visible:
      id: menu-error
    timeout: 10000
- assertVisible: The test request could not be completed.
- takeScreenshot: example/.maestro/artifacts/react-native-menu-error
- tapOn:
    id: menu-error-retry
- extendedWaitUntil:
    visible:
      id: restaurant-menu-item-0
    timeout: 10000
- tapOn:
    id: restaurant-detail-back
# "menu empty": the restaurant has no menu items.
- extendedWaitUntil:
    visible:
      id: restaurant-search-clear
    timeout: 10000
- tapOn:
    id: restaurant-search-clear
- tapOn:
    id: restaurant-search-input
- inputText: menu empty
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 15000
- tapOn:
    id: restaurant-result-0
- extendedWaitUntil:
    visible:
      id: menu-empty
    timeout: 10000
- assertVisible: No menu items found
- takeScreenshot: example/.maestro/artifacts/react-native-menu-empty
