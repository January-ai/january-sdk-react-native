appId: ai.january.sdk.demo
name: Food logs loading empty failure and retry
tags:
  - fixture
---
- launchApp:
    clearState: false
    stopApp: true
- openLink: exp+january-sdk-demo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- runFlow:
    when:
      visible: http://127.0.0.1:8081
    commands:
      - tapOn: http://127.0.0.1:8081
- extendedWaitUntil:
    visible:
      id: tab-food-logs
    timeout: 15000
- tapOn:
    id: tab-food-logs
- scrollUntilVisible:
    element:
      id: food-log-0
    direction: DOWN
- scrollUntilVisible:
    element:
      id: food-logs-refresh
    direction: UP
- tapOn:
    id: food-logs-refresh
- assertVisible:
    id: food-logs-loading
- takeScreenshot: example/.maestro/artifacts/react-native-logs-loading
- extendedWaitUntil:
    visible:
      id: food-log-0
    timeout: 15000
- tapOn:
    id: logs-range-month
- assertVisible:
    id: food-logs-loading
- extendedWaitUntil:
    visible:
      id: food-logs-empty
    timeout: 15000
- assertVisible: No food logs in this range
- takeScreenshot: example/.maestro/artifacts/react-native-logs-empty
- tapOn:
    id: logs-range-week
- extendedWaitUntil:
    visible:
      id: food-log-0
    timeout: 15000
- longPressOn:
    id: food-logs-refresh
- assertVisible:
    id: food-logs-loading
- extendedWaitUntil:
    visible:
      id: food-logs-error
    timeout: 15000
- assertVisible: Temporary fixture food logs failure.
- takeScreenshot: example/.maestro/artifacts/react-native-logs-error
- tapOn:
    id: food-logs-retry
- extendedWaitUntil:
    visible:
      id: food-log-0
    timeout: 15000
- assertNotVisible:
    id: food-logs-error
