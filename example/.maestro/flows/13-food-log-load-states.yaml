appId: ai.january.sdk.demo
name: Food logs loading empty failure and retry
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-food-logs
    timeout: 15000
- tapOn:
    id: tab-food-logs
- scrollUntilVisible:
    element:
      id: food-log-0
    direction: DOWN
- scrollUntilVisible:
    element:
      id: food-logs-refresh
    direction: UP
- tapOn:
    id: food-logs-refresh
- takeScreenshot: example/.maestro/artifacts/react-native-logs-loading
- extendedWaitUntil:
    visible:
      id: food-log-0
    timeout: 15000
- tapOn:
    id: logs-range-month
- extendedWaitUntil:
    visible:
      id: food-logs-empty
    timeout: 15000
- assertVisible: No food logs in this range
- takeScreenshot: example/.maestro/artifacts/react-native-logs-empty
- tapOn:
    id: logs-range-week
- extendedWaitUntil:
    visible:
      id: food-log-0
    timeout: 15000
- longPressOn:
    id: food-logs-refresh
- extendedWaitUntil:
    visible:
      id: food-logs-error
    timeout: 15000
- assertVisible: Temporary fixture food logs failure.
- takeScreenshot: example/.maestro/artifacts/react-native-logs-error
- tapOn:
    id: food-logs-retry
- extendedWaitUntil:
    visible:
      id: food-log-0
    timeout: 15000
- assertNotVisible:
    id: food-logs-error
