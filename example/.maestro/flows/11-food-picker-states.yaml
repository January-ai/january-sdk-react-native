appId: ai.january.sdk.demo
name: Food picker loading empty error retry and validation
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-glucose
    timeout: 15000
- tapOn:
    id: tab-glucose
- scrollUntilVisible:
    element:
      id: glucose-add-food
    direction: DOWN
- tapOn:
    id: glucose-add-food
- tapOn:
    id: food-picker-input
- inputText: no results
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-picker-empty
    timeout: 15000
- assertVisible: No foods found
- tapOn:
    id: food-picker-input
- eraseText: 30
- inputText: retry picker
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-picker-error
    timeout: 15000
- assertVisible: Temporary fixture picker failure.
- tapOn:
    id: food-picker-retry
- extendedWaitUntil:
    visible:
      id: food-picker-result-0
    timeout: 15000
- tapOn:
    id: food-picker-close
- tapOn:
    id: glucose-add-food
- tapOn:
    id: food-picker-input
- inputText: missing serving
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-picker-result-0
    timeout: 15000
- tapOn:
    id: food-picker-result-0
- assertVisible:
    id: food-serving-sheet
- assertVisible:
    id: food-serving-add
- tapOn:
    id: food-serving-add
- assertVisible:
    id: food-picker
