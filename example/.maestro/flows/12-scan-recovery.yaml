appId: ai.january.sdk.demo
name: Scan and correction failures recover without losing input
tags:
  - fixture
---
- launchApp:
    clearState: false
    stopApp: true
- openLink: exp+january-sdk-demo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- runFlow:
    when:
      visible: http://127.0.0.1:8081
    commands:
      - tapOn: http://127.0.0.1:8081
- extendedWaitUntil:
    visible:
      id: tab-scan
    timeout: 15000
- tapOn:
    id: tab-scan
- longPressOn:
    id: scan-sample
- assertVisible:
    id: scan-preview
- tapOn:
    id: scan-analyze
- assertVisible:
    id: scan-loading
- scrollUntilVisible:
    element:
      id: scan-error
    direction: DOWN
- assertVisible: Temporary fixture scan failure.
- tapOn:
    id: scan-retry
- extendedWaitUntil:
    visible:
      id: scan-results
    timeout: 15000
- assertVisible: Fixture breakfast
- scrollUntilVisible:
    element:
      id: scan-correction-input
    direction: DOWN
- tapOn:
    id: scan-correction-input
- inputText: retry correction
- hideKeyboard
- tapOn:
    id: scan-correction-submit
- assertVisible:
    id: scan-correction-loading
- scrollUntilVisible:
    element:
      id: scan-error
    direction: DOWN
- assertVisible: Temporary fixture correction failure.
- assertVisible: retry correction
- scrollUntilVisible:
    element:
      id: scan-retry
    direction: DOWN
- tapOn:
    id: scan-retry
- scrollUntilVisible:
    element:
      text: Corrected breakfast
    direction: UP
- scrollUntilVisible:
    element:
      id: scan-another
    direction: DOWN
- tapOn:
    id: scan-another
- assertVisible:
    id: scan-guide
- assertNotVisible:
    id: scan-results
