appId: ai.january.sdk.demo
name: Scan and correction failures recover without losing input
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-scan
    timeout: 15000
- tapOn:
    id: tab-scan
- longPressOn:
    id: scan-sample
- assertVisible:
    id: scan-preview
- tapOn:
    id: scan-analyze
- scrollUntilVisible:
    element:
      id: scan-error
    direction: DOWN
- assertVisible: Temporary fixture scan failure.
- tapOn:
    id: scan-error-retry
- extendedWaitUntil:
    visible:
      id: scan-results
    timeout: 15000
- assertVisible: Fixture breakfast
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: scan-correct
          direction: DOWN
      - tapOn:
          id: scan-correct
      - tapOn:
          id: scan-correction-input
      - inputText: retry correction
      - assertVisible: retry correction
      - pressKey: Enter
      - scrollUntilVisible:
          element:
            id: scan-correction-error
          direction: DOWN
      - assertVisible: Temporary fixture correction failure.
      - assertVisible: retry correction
      - scrollUntilVisible:
          element:
            id: scan-correction-error-retry
          direction: DOWN
      - tapOn:
          id: scan-correction-error-retry
      - scrollUntilVisible:
          element:
            text: Corrected breakfast
          direction: UP
- scrollUntilVisible:
    element:
      id: scan-another
    direction: DOWN
- tapOn:
    id: scan-another
- assertVisible:
    id: scan-guide
- assertNotVisible:
    id: scan-results
