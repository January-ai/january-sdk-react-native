appId: ai.january.sdk.demo
name: Search loading failure retry and state retention
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
- tapOn:
    id: search-input
- inputText: retry search
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: search-error
    timeout: 15000
- assertVisible: Temporary fixture search failure.
- assertVisible: retry search
- tapOn:
    id: search-retry
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 15000
- scrollUntilVisible:
    element:
      id: food-result-0
    direction: DOWN
- assertVisible:
    id: food-result-0
- assertNotVisible:
    id: search-error
