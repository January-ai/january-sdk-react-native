appId: ai.january.sdk.demo
name: Settings - switch the end user, and the setup screen of an unconfigured build
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: app-root
    timeout: 15000
- tapOn:
    id: settings-button
- assertVisible:
    id: settings-sheet
- assertVisible:
    id: settings-connection
- assertVisible: Test fixture
# Every request is for this user; editing it and closing Settings switches the
# demo to a new client for them.
- tapOn:
    id: settings-user-id
- eraseText: 30
- inputText: fixture-user-2
- tapOn:
    id: settings-close
- assertNotVisible:
    id: settings-sheet
- tapOn:
    id: tab-food-logs
- extendedWaitUntil:
    visible:
      id: food-log-user-id
      text: fixture-user-2
    timeout: 15000
- assertVisible:
    id: food-log-user-timezone
- tapOn:
    id: tab-glucose
- tapOn:
    id: settings-button
- assertVisible:
    id: settings-user-id
    text: fixture-user-2
# The About rows sit below the fold of the half-height sheet. Its list starts
# at the middle of the screen, where scrollUntilVisible starts its swipes, so
# swipe inside the sheet instead, as often as the screen needs: one swipe
# reaches the end on a fast device but not on a slow emulator. The last swipe
# settles the list at its end, with the last row clear of the bottom edge.
- repeat:
    while:
      notVisible:
        id: settings-row-january-api
    times: 4
    commands:
      - swipe:
          start: 50%, 90%
          end: 50%, 60%
          duration: 400
- swipe:
    start: 50%, 90%
    end: 50%, 60%
    duration: 400
- assertVisible:
    id: settings-timezone
- assertVisible:
    id: settings-row-native-module
- assertVisible:
    id: settings-row-january-api
- assertVisible: Production
- repeat:
    while:
      notVisible:
        id: settings-connection
    times: 4
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 90%
          duration: 400
- swipe:
    start: 50%, 60%
    end: 50%, 90%
    duration: 400
# In fixture mode a long press on the connection shows the screen a build with
# no token endpoint opens on.
- longPressOn:
    id: settings-connection
- extendedWaitUntil:
    visible:
      id: setup-screen
    timeout: 10000
- assertVisible: Welcome to January
- assertVisible: Start the token relay
- takeScreenshot: example/.maestro/artifacts/react-native-setup
