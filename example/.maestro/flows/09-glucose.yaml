appId: ai.january.sdk.demo
name: Glucose meal prediction
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-glucose
    timeout: 15000
- tapOn:
    id: tab-glucose
- assertVisible: Estimate this meal’s response
- scrollUntilVisible:
    element:
      id: glucose-add-food
    direction: DOWN
- tapOn:
    id: glucose-add-food
- tapOn:
    id: food-picker-input
- inputText: greek yogurt
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-picker-result-0
    timeout: 15000
- tapOn:
    id: food-picker-result-0
- assertVisible:
    id: food-serving-sheet
- takeScreenshot: example/.maestro/artifacts/react-native-serving
- tapOn:
    id: food-serving-add
- assertVisible:
    id: glucose-food-0
- scrollUntilVisible:
    element:
      id: glucose-predict
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: Estimate glucose response
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: glucose-results-screen
    timeout: 15000
- assertVisible: .*medium impact.*
- assertVisible:
    id: glucose-chart
- takeScreenshot: example/.maestro/artifacts/react-native-glucose-result
