appId: ai.january.sdk.demo
name: Settings shows SDK configuration
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: settings-button
    timeout: 15000
- tapOn:
    id: tab-glucose
- tapOn:
    id: settings-button
- assertVisible: Settings
- assertVisible: January SDK
- assertVisible: Development API key
- assertVisible: Connected
- assertVisible: End user ID
- assertVisible: parity-user
- takeScreenshot: example/.maestro/artifacts/react-native-settings
- tapOn:
    id: settings-close
- assertNotVisible: Settings
