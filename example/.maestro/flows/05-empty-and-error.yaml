appId: ai.january.sdk.demo
name: Empty and error states are actionable
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
- tapOn:
    id: search-input
- inputText: no results
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: empty-results
    timeout: 15000
- assertVisible: No foods found
- assertVisible: Try another name or broaden the selected food category.
- tapOn:
    id: search-clear
- tapOn:
    id: search-input
- inputText: force error
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: search-error
    timeout: 15000
