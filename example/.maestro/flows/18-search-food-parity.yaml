appId: ai.january.sdk.demo
name: Native parity - search and food detail surfaces
tags:
  - parity
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-search
    timeout: 15000
- tapOn:
    id: tab-search
- assertVisible:
    id: search-scope-restaurants
- assertVisible:
    id: search-mode-barcode
- takeScreenshot: example/.maestro/artifacts/react-native-search-initial
- tapOn:
    id: search-input
- inputText: oatmeal
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-result-0
    timeout: 15000
- takeScreenshot: example/.maestro/artifacts/react-native-search-results
- tapOn:
    id: food-result-0
- assertVisible: Food details
- takeScreenshot: example/.maestro/artifacts/react-native-food-detail
- scrollUntilVisible:
    element:
      id: food-nutrition
    direction: DOWN
- takeScreenshot: example/.maestro/artifacts/react-native-food-nutrition
- scrollUntilVisible:
    element:
      id: food-check-glucose
    direction: DOWN
- tapOn:
    id: food-check-glucose
- assertVisible: Glucose response
- assertVisible:
    id: food-glucose-loading
- takeScreenshot: example/.maestro/artifacts/react-native-food-glucose-loading
- extendedWaitUntil:
    visible:
      id: food-glucose-result
    timeout: 15000
- takeScreenshot: example/.maestro/artifacts/react-native-food-glucose-result
- tapOn: Close Glucose response
- scrollUntilVisible:
    element:
      id: food-alternatives
    direction: DOWN
- tapOn:
    id: food-alternatives
- assertVisible: Food alternatives
- takeScreenshot: example/.maestro/artifacts/react-native-alternatives-initial
- scrollUntilVisible:
    element:
      id: alternatives-refresh
    direction: DOWN
- tapOn:
    id: alternatives-refresh
- extendedWaitUntil:
    visible: SUGGESTIONS · 1
    timeout: 15000
- takeScreenshot: example/.maestro/artifacts/react-native-alternatives-results
