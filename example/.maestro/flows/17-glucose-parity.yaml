appId: ai.january.sdk.demo
name: Native parity - glucose surfaces
tags:
  - parity
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-glucose
    timeout: 15000
- tapOn:
    id: tab-glucose
- assertVisible: Estimate this meal’s response
- assertVisible:
    id: glucose-height-unit-metric
- takeScreenshot: example/.maestro/artifacts/react-native-glucose-profile
- tapOn:
    id: glucose-height-unit-metric
- assertVisible:
    id: glucose-height-centimeters
- takeScreenshot: example/.maestro/artifacts/react-native-glucose-height-metric
- tapOn:
    id: glucose-height-unit-imperial
- scrollUntilVisible:
    element:
      id: glucose-weight-unit-kg
    direction: DOWN
- tapOn:
    id: glucose-weight-unit-kg
- scrollUntilVisible:
    element:
      id: glucose-weight
    direction: DOWN
- takeScreenshot: example/.maestro/artifacts/react-native-glucose-weight-metric
- tapOn:
    id: glucose-weight-unit-lb
- scrollUntilVisible:
    element:
      id: glucose-health-conditions
    direction: DOWN
- tapOn:
    id: glucose-health-conditions
- assertVisible: Health conditions
- takeScreenshot: example/.maestro/artifacts/react-native-conditions
- tapOn:
    id: condition-type-2-diabetes
- tapOn:
    id: conditions-back
- scrollUntilVisible:
    element:
      id: glucose-add-food
    direction: DOWN
- tapOn:
    id: glucose-add-food
- assertVisible:
    id: food-picker
- takeScreenshot: example/.maestro/artifacts/react-native-food-picker-initial
- tapOn:
    id: food-picker-input
- inputText: oatmeal
- takeScreenshot: example/.maestro/artifacts/react-native-food-picker-keyboard
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-picker-result-0
    timeout: 15000
- tapOn:
    id: food-picker-result-0
- assertVisible:
    id: food-serving-sheet
- assertVisible: Choose serving
- takeScreenshot: example/.maestro/artifacts/react-native-serving
- tapOn:
    id: food-serving-add
- assertVisible:
    id: glucose-food-0
- scrollUntilVisible:
    element:
      id: glucose-predict
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: Estimate glucose response
    retryTapIfNoChange: true
- takeScreenshot: example/.maestro/artifacts/react-native-glucose-loading
- extendedWaitUntil:
    visible:
      id: glucose-results-screen
    timeout: 15000
- assertVisible: LIKELY PEAK
- assertVisible: 140
- takeScreenshot: example/.maestro/artifacts/react-native-glucose-result
