appId: ai.january.sdk.demo
name: Android parity - glucose surfaces
tags:
  - parity
---
- launchApp:
    clearState: false
    stopApp: true
- openLink: exp+january-sdk-demo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- runFlow:
    when:
      visible: http://127.0.0.1:8081
    commands:
      - tapOn: http://127.0.0.1:8081
- extendedWaitUntil:
    visible:
      id: tab-glucose
    timeout: 15000
- tapOn:
    id: tab-glucose
- assertVisible: Estimate this meal’s response
- assertVisible:
    id: glucose-height-unit-metric
- takeScreenshot: example/.maestro/artifacts/react-native-glucose-profile
- tapOn:
    id: glucose-height-unit-metric
- assertVisible:
    id: glucose-height-centimeters
- tapOn:
    id: glucose-height-unit-imperial
- scrollUntilVisible:
    element:
      id: glucose-health-conditions
    direction: DOWN
- tapOn:
    id: glucose-health-conditions
- assertVisible: Health conditions
- takeScreenshot: example/.maestro/artifacts/react-native-conditions
- tapOn:
    id: condition-type-2-diabetes
- tapOn:
    id: conditions-back
- scrollUntilVisible:
    element:
      id: glucose-add-food
    direction: DOWN
- tapOn:
    id: glucose-add-food
- assertVisible:
    id: food-picker
- takeScreenshot: example/.maestro/artifacts/react-native-food-picker-initial
- tapOn:
    id: food-picker-input
- inputText: oatmeal
- takeScreenshot: example/.maestro/artifacts/react-native-food-picker-keyboard
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-picker-result-0
    timeout: 15000
- tapOn:
    id: food-picker-result-0
- assertVisible:
    id: food-serving-sheet
- assertVisible: Choose serving
- tapOn:
    id: food-serving-add
- assertVisible:
    id: glucose-food-0
- scrollUntilVisible:
    element:
      id: glucose-predict
    direction: DOWN
- tapOn:
    id: glucose-predict
- extendedWaitUntil:
    visible:
      id: glucose-result
    timeout: 15000
- assertVisible: LIKELY PEAK
- assertVisible: 140
- takeScreenshot: example/.maestro/artifacts/react-native-glucose-result
