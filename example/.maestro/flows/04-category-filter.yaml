appId: ai.january.sdk.demo
name: Food category selection reaches search
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: category-general
    timeout: 15000
- tapOn:
    id: category-general
- tapOn:
    id: search-input
- inputText: category
- pressKey: Enter
- extendedWaitUntil:
    visible: .*Generic category fixture.*
    timeout: 15000
- tapOn:
    id: search-clear
- tapOn:
    id: category-branded
- tapOn:
    id: search-input
- inputText: category
- pressKey: Enter
- extendedWaitUntil:
    visible: .*Branded category fixture.*
    timeout: 15000
- assertNotVisible: .*Generic category fixture.*
