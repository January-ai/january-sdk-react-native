appId: ai.january.sdk.demo
name: Android parity - food log surfaces
tags:
  - parity
---
- launchApp:
    clearState: false
    stopApp: true
- openLink: exp+january-sdk-demo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- runFlow:
    when:
      visible: http://127.0.0.1:8081
    commands:
      - tapOn: http://127.0.0.1:8081
- extendedWaitUntil:
    visible:
      id: tab-food-logs
    timeout: 15000
- tapOn:
    id: tab-food-logs
- assertVisible:
    id: food-log-user-card
- takeScreenshot: example/.maestro/artifacts/react-native-logs-initial
- scrollUntilVisible:
    element:
      id: food-logs-refresh
    direction: DOWN
- tapOn:
    id: food-logs-refresh
- assertVisible:
    id: food-logs-loading
- takeScreenshot: example/.maestro/artifacts/react-native-logs-loading
- extendedWaitUntil:
    visible:
      id: food-log-0
    timeout: 10000
- takeScreenshot: example/.maestro/artifacts/react-native-logs-results
- tapOn:
    id: logs-range-month
- extendedWaitUntil:
    visible:
      id: food-logs-empty
    timeout: 10000
- takeScreenshot: example/.maestro/artifacts/react-native-logs-empty
- tapOn:
    id: logs-range-week
- extendedWaitUntil:
    visible:
      id: food-log-0
    timeout: 10000
- tapOn:
    id: food-log-0
- assertVisible:
    id: food-log-detail
- takeScreenshot: example/.maestro/artifacts/react-native-log-detail
- tapOn:
    id: food-log-edit
- assertVisible: Edit food log
- takeScreenshot: example/.maestro/artifacts/react-native-log-edit
