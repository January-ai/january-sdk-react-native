appId: ai.january.sdk.demo
name: Native SDK live food search
tags:
  - live
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
# Records the end user and stops here, before the flow's own requests, if the
# API account has no requests left.
- runFlow: ../live/context.yaml
- tapOn:
    id: search-input
- inputText: greek yogurt
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 30000
- assertVisible:
    id: food-result-0
- assertVisible: Results · January food database
