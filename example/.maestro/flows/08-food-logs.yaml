appId: ai.january.sdk.demo
name: Food logs browse and create
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-food-logs
    timeout: 15000
- tapOn:
    id: tab-food-logs
- scrollUntilVisible:
    element:
      id: food-log-0
    direction: DOWN
- tapOn:
    id: food-log-0
- assertVisible:
    id: food-log-detail
- assertVisible: Fixture oatmeal
- tapOn: Back from food log
- tapOn:
    id: food-log-add
- assertVisible: New food log
- tapOn:
    id: food-log-name
- inputText: Afternoon snack
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: food-log-add-food
    direction: DOWN
- tapOn:
    id: food-log-add-food
- assertVisible:
    id: food-picker
- tapOn:
    id: food-picker-input
- inputText: greek yogurt
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-picker-result-0
    timeout: 15000
- tapOn:
    id: food-picker-result-0
- assertVisible:
    id: food-serving-sheet
- tapOn:
    id: food-serving-add
- scrollUntilVisible:
    element:
      id: food-log-save
    direction: DOWN
- tapOn:
    id: food-log-save
- extendedWaitUntil:
    visible: .*Afternoon snack.*
    timeout: 15000
