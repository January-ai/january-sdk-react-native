appId: ai.january.sdk.demo
name: Food logs browse and create
tags:
  - fixture
---
- launchApp:
    clearState: false
    stopApp: true
- openLink: exp+january-sdk-demo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- runFlow:
    when:
      visible: http://127.0.0.1:8081
    commands:
      - tapOn: http://127.0.0.1:8081
- extendedWaitUntil:
    visible:
      id: tab-food-logs
    timeout: 15000
- tapOn:
    id: tab-food-logs
- extendedWaitUntil:
    visible: Fixture breakfast
    timeout: 15000
- tapOn:
    id: food-log-0
- assertVisible:
    id: food-log-detail
- assertVisible: Oatmeal with berries
- tapOn: Back from food log
- tapOn:
    id: food-log-add
- assertVisible: New food log
- tapOn:
    id: food-log-name
- inputText: Afternoon snack
- hideKeyboard
- scrollUntilVisible:
    element:
      id: food-log-add-food
    direction: DOWN
- tapOn:
    id: food-log-add-food
- assertVisible:
    id: food-picker
- tapOn:
    id: food-picker-input
- inputText: greek yogurt
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-picker-result-0
    timeout: 15000
- tapOn:
    id: food-picker-result-0
- tapOn:
    id: food-log-save
- extendedWaitUntil:
    visible: Afternoon snack
    timeout: 15000
