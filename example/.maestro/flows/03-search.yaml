appId: ai.january.sdk.demo
name: Food search renders fixture results
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
- tapOn:
    id: search-input
- inputText: greek yogurt
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 15000
- assertVisible: Results · January food database
- assertVisible: Greek yogurt
- assertVisible: .*100 cal.*
- assertVisible: .*Greek Yogurt, Strawberry or Vanilla.*
- assertVisible:
    id: food-result-0
- assertVisible:
    id: food-result-1
