appId: ai.january.sdk.demo
name: Glucose failure retains profile and meal then recovers
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-glucose
    timeout: 15000
- tapOn:
    id: tab-glucose
- tapOn:
    id: glucose-age
- eraseText: 10
- inputText: 99
- pressKey: Enter
- tapOn:
    id: glucose-sex-male
- scrollUntilVisible:
    element:
      id: glucose-health-conditions
    direction: DOWN
- tapOn:
    id: glucose-health-conditions
- tapOn:
    id: condition-type-2-diabetes
- tapOn:
    id: conditions-back
- scrollUntilVisible:
    element:
      id: glucose-add-food
    direction: DOWN
- tapOn:
    id: glucose-add-food
- tapOn:
    id: food-picker-input
- inputText: greek yogurt
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: food-picker-result-0
    timeout: 15000
- tapOn:
    id: food-picker-result-0
- tapOn:
    id: food-serving-add
- tapOn: Increase Greek yogurt quantity
- assertVisible: '1.25'
- scrollUntilVisible:
    element:
      id: glucose-predict
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: Estimate glucose response
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: glucose-error
    timeout: 15000
- assertVisible: The test request could not be completed.
- assertVisible:
    id: glucose-food-0
- scrollUntilVisible:
    element:
      id: glucose-retry
    direction: DOWN
- takeScreenshot: example/.maestro/artifacts/react-native-glucose-error
- tapOn:
    id: glucose-retry
- extendedWaitUntil:
    visible:
      id: glucose-result
    timeout: 15000
- assertVisible:
    id: glucose-chart
- assertVisible: Greek yogurt
- assertVisible: .*6 oz · quantity 1.25.*
- scrollUntilVisible:
    element:
      id: glucose-adjust
    direction: DOWN
- tapOn:
    id: glucose-adjust
- scrollUntilVisible:
    element:
      id: glucose-food-0
    direction: DOWN
- assertVisible:
    id: glucose-food-0
- scrollUntilVisible:
    element:
      id: glucose-age
    direction: UP
- assertVisible:
    id: glucose-age
- scrollUntilVisible:
    element:
      id: glucose-predict
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: Estimate glucose response
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: glucose-result
    timeout: 15000
- scrollUntilVisible:
    element:
      id: glucose-start-over
    direction: DOWN
- tapOn:
    id: glucose-start-over
- assertVisible:
    id: glucose-screen
- assertNotVisible:
    id: glucose-food-0
