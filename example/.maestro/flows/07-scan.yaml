appId: ai.january.sdk.demo
name: Meal scan and correction
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-scan
    timeout: 15000
- tapOn:
    id: tab-scan
- tapOn:
    id: scan-sample
- assertVisible:
    id: scan-preview
- tapOn:
    id: scan-analyze
- extendedWaitUntil:
    visible:
      id: scan-results
    timeout: 15000
- assertVisible: Fixture breakfast
- scrollUntilVisible:
    element:
      text: Fixture oatmeal
    direction: DOWN
- assertVisible: Fixture oatmeal
# Scrolling only until the button shows can leave it at the bottom edge, under
# the tab bar and Android's navigation bar, where the tap pressed Home.
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: scan-correct
- tapOn:
    id: scan-correct
- extendedWaitUntil:
    visible:
      id: scan-correction-input
    timeout: 15000
- tapOn:
    id: scan-correction-input
- inputText: This was lentils
- pressKey: Enter
- extendedWaitUntil:
    visible: Corrected breakfast
    timeout: 15000
