appId: ai.january.sdk.demo
name: Meal scan and correction
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-scan
    timeout: 15000
- tapOn:
    id: tab-scan
- tapOn:
    id: scan-sample
- assertVisible:
    id: scan-preview
- tapOn:
    id: scan-analyze
- extendedWaitUntil:
    visible:
      id: scan-results
    timeout: 15000
- assertVisible: Fixture breakfast
- scrollUntilVisible:
    element:
      text: Fixture oatmeal
    direction: DOWN
- assertVisible: Fixture oatmeal
- scrollUntilVisible:
    element:
      id: scan-correct
    direction: DOWN
- tapOn: Correct result
- extendedWaitUntil:
    visible:
      id: scan-correction-input
    timeout: 15000
- tapOn:
    id: scan-correction-input
- inputText: This was lentils
- pressKey: Enter
- extendedWaitUntil:
    visible: Corrected breakfast
    timeout: 15000
