name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: '2.7.0'
  MAESTRO_SHA256: 'a4ccab6b604617e7aef6db4f885666056eabe5cfa32befaa3bc994041b8fcbb5'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

      - name: Validate GitBook documentation
        run: yarn docs:check

      - name: Check that the UI flows exercise every test ID
        run: yarn ui:coverage

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: |
          yarn prepare
          npm pack --dry-run

  build-android:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android
      APK: example/android/app/build/outputs/apk/debug/app-debug.apk

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          # A new key every run, so the freshly written Turborepo entries are
          # saved (Actions cache entries are immutable); the prefixes restore the
          # closest earlier cache. turbo.json is in the key so a changed task
          # definition never reuses entries written under the old one.
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock', 'turbo.json') }}-

      - name: Install JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Prebuild expo app for Android
        run: |
          yarn example expo prebuild --platform android

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        # Turborepo skips the build and restores the APK when nothing relevant
        # changed. A cache entry written before the APK was a declared output
        # restores nothing, so build again in that case.
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"
          if [[ ! -f "$APK" ]]; then
            yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --force
          fi
          test -f "$APK"

      - name: Upload the Android app for the UI suite
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-app
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 1

  build-ios:
    runs-on: macos-latest

    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
      APP: example/ios/build/Build/Products/Debug-iphonesimulator/JanuarySDKDemo.app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          # A new key every run, so the freshly written Turborepo entries are
          # saved (Actions cache entries are immutable); the prefixes restore the
          # closest earlier cache. turbo.json is in the key so a changed task
          # definition never reuses entries written under the old one.
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock', 'turbo.json') }}-

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Prebuild expo app for iOS
        run: |
          yarn example expo prebuild --platform ios

      - name: Install iOS pods
        run: |
          cd example/ios
          pod install

      - name: Show the inputs Turborepo hashes for iOS
        # Printed so two runs can be compared when the cache unexpectedly misses.
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const t=JSON.parse(d).tasks[0];console.log("task hash",t.hash);for(const [f,h] of Object.entries(t.inputs).sort())console.log(h.slice(0,12),f)})'

      - name: Build example for iOS
        # Turborepo skips the build and restores the app when nothing relevant
        # changed. The generated example/ios is among the inputs, so the hash
        # is only meaningful after prebuild; a cache entry written before the
        # app was a declared output restores nothing, so build again then.
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"
          if [[ ! -d "$APP" ]]; then
            yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --force
          fi
          test -d "$APP"

      - name: Pack the iOS app for the UI suite
        # tar keeps the executable bits that upload-artifact would drop.
        run: tar -czf "$RUNNER_TEMP/ios-app.tgz" -C "$(dirname "$APP")" "$(basename "$APP")"

      - name: Upload the iOS app for the UI suite
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-app
          path: ${{ runner.temp }}/ios-app.tgz
          if-no-files-found: error
          retention-days: 1

  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build example for Web
        run: |
          yarn example build:web

  # The Maestro suites reuse the apps the build jobs produced and split the
  # flows across several emulators and simulators (four Android, three iOS),
  # so each job stays well under its time limit. Maestro's failure screenshots and view hierarchies
  # are uploaded with the JUnit results.
  ui-test-android:
    name: ui-test-android (shard ${{ matrix.shard }} of 4)
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Maestro
        run: |
          archive="$RUNNER_TEMP/maestro.zip"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$archive"
          echo "${MAESTRO_SHA256}  ${archive}" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/maestro"
          "$RUNNER_TEMP/maestro/maestro/bin/maestro" --version
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Download the Android app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-app
          path: ${{ runner.temp }}/android-app

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android device suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          # The action's defaults plus more memory: with the default 2 GB the
          # emulator went offline mid-shard and hung on app launches.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096
          script: .github/scripts/android-ui-suite.sh "$RUNNER_TEMP/android-app/app-debug.apk" ${{ matrix.shard }} 4

      - name: Upload Android UI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-android-${{ matrix.shard }}
          path: |
            example/.maestro/artifacts
            ${{ runner.temp }}/metro-android.log

  ui-test-ios:
    name: ui-test-ios (shard ${{ matrix.shard }} of 3)
    needs: build-ios
    runs-on: macos-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 26

      - name: Install Maestro
        run: |
          archive="$RUNNER_TEMP/maestro.zip"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$archive"
          echo "${MAESTRO_SHA256}  ${archive}" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/maestro"
          "$RUNNER_TEMP/maestro/maestro/bin/maestro" --version
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Download the iOS app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-app
          path: ${{ runner.temp }}

      - name: Run iOS device suite
        run: |
          mkdir -p "$RUNNER_TEMP/ios-app"
          tar -xzf "$RUNNER_TEMP/ios-app.tgz" -C "$RUNNER_TEMP/ios-app"
          device_id="$(xcrun simctl list devices available | sed -nE 's/.*iPhone[^()]* \(([0-9A-F-]+)\) \(Shutdown\).*/\1/p' | head -1)"
          test -n "$device_id"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$RUNNER_TEMP/ios-app/JanuarySDKDemo.app"
          # A fresh simulator shows expo-dev-menu's onboarding sheet over the app
          # on first launch, which hides the screen the bootstrap waits for.
          for key in EXDevMenuIsOnboardingFinished; do
            xcrun simctl spawn "$device_id" defaults write ai.january.sdk.demo "$key" -bool true
          done
          for key in EXDevMenuShowsAtLaunch EXDevMenuShowFloatingActionButton; do
            xcrun simctl spawn "$device_id" defaults write ai.january.sdk.demo "$key" -bool false
          done
          CI=1 EXPO_NO_METRO_LAZY=1 yarn ui:start > "$RUNNER_TEMP/metro-ios.log" 2>&1 &
          metro_pid=$!
          trap 'kill "$metro_pid" 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            curl --fail --silent http://127.0.0.1:8081/status >/dev/null && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8081/status
          # Warm Metro before the first flow launches the app: request the exact
          # bundle the dev client will ask for, taken from the manifest.
          bundle_url="$(curl --fail --silent -H 'expo-platform: ios' http://127.0.0.1:8081/ \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).launchAsset.url))')"
          echo "Warming up $bundle_url"
          curl --fail --silent --output /dev/null --max-time 600 "$bundle_url"
          flows="$(node example/.maestro/shard.mjs ${{ matrix.shard }} 3)"
          echo "Flows in this shard: $flows"
          test -n "$flows"
          # shellcheck disable=SC2086 # the shard is a space-separated list of files
          .github/scripts/run-maestro-shard.sh "$device_id" ios-results $flows

      - name: Upload iOS UI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-ios-${{ matrix.shard }}
          path: |
            example/.maestro/artifacts
            !example/.maestro/artifacts/debug/**/device-simulator.log
            ${{ runner.temp }}/metro-ios.log

  # One check that summarizes every shard, so branch protection can require a
  # single stable name.
  ui-tests:
    needs: [ui-test-android, ui-test-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every UI shard passed
        env:
          ANDROID: ${{ needs.ui-test-android.result }}
          IOS: ${{ needs.ui-test-ios.result }}
        run: |
          echo "android=$ANDROID ios=$IOS"
          test "$ANDROID" = "success" && test "$IOS" = "success"
